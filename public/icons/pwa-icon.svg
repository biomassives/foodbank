<!--
  Funky Pony Space — PWA App Icon
  Circular badge featuring the GNU×Pony mascot with constellation lattice.
  GPL-3.0 — Funky Pony Pantry contributors
-->
<svg width="512" height="512" viewBox="0 0 512 512"
  xmlns="http://www.w3.org/2000/svg"
  role="img"
  aria-label="Funky Pony Space — community food pantry">
  <title>Funky Pony Space</title>

  <defs>
    <!-- Top arc (clockwise W→N→E): text reads right-side up at 12 o'clock -->
    <path id="ta" d="M 26,256 A 230,230 0 0 1 486,256"/>
    <!-- Bottom arc (counter-clockwise W→S→E): text reads right-side up at 6 o'clock -->
    <path id="ba" d="M 26,256 A 230,230 0 0 0 486,256"/>
    <!-- Clip mascot to inner circle -->
    <clipPath id="mc">
      <circle cx="256" cy="256" r="210"/>
    </clipPath>
  </defs>

  <!-- ── Outer badge background ── -->
  <circle cx="256" cy="256" r="256" fill="#111014"/>

  <!-- ── Inner mascot face ── -->
  <circle cx="256" cy="256" r="212" fill="#1a1824"/>

  <!-- ── Gold rings ── -->
  <circle cx="256" cy="256" r="216" fill="none" stroke="#fdd835" stroke-width="1.5" opacity="0.35"/>
  <circle cx="256" cy="256" r="247" fill="none" stroke="#fdd835" stroke-width="2.5"/>

  <!-- ── Cardinal sparkle stars (on outer ring) ── -->
  <!-- North (256, 9) -->
  <g fill="#fdd835" stroke="#fdd835" stroke-linecap="round">
    <circle cx="256" cy="9" r="3"/>
    <line x1="248" y1="9" x2="264" y2="9" stroke-width="1.4"/>
    <line x1="256" y1="1" x2="256" y2="17" stroke-width="1.4"/>
  </g>
  <!-- East (503, 256) -->
  <g fill="#fdd835" stroke="#fdd835" stroke-linecap="round">
    <circle cx="503" cy="256" r="3"/>
    <line x1="495" y1="256" x2="511" y2="256" stroke-width="1.4"/>
    <line x1="503" y1="248" x2="503" y2="264" stroke-width="1.4"/>
  </g>
  <!-- South (256, 503) -->
  <g fill="#fdd835" stroke="#fdd835" stroke-linecap="round">
    <circle cx="256" cy="503" r="3"/>
    <line x1="248" y1="503" x2="264" y2="503" stroke-width="1.4"/>
    <line x1="256" y1="495" x2="256" y2="511" stroke-width="1.4"/>
  </g>
  <!-- West (9, 256) -->
  <g fill="#fdd835" stroke="#fdd835" stroke-linecap="round">
    <circle cx="9" cy="256" r="3"/>
    <line x1="1" y1="256" x2="17" y2="256" stroke-width="1.4"/>
    <line x1="9" y1="248" x2="9" y2="264" stroke-width="1.4"/>
  </g>

  <!-- ── GNU Pony mascot — scaled 0.75, centered at (256,256) ── -->
  <!-- Colors: wb-text=#ede8df  wb-bg=#1a1824  wb-accent=#fdd835 -->
  <g clip-path="url(#mc)">
    <g transform="translate(181,162) scale(0.75)">

      <!-- Star lattice connection lines -->
      <g stroke="#ede8df" stroke-width="0.75" fill="none" opacity="0.17">
        <line x1="18" y1="25" x2="34" y2="17"/>
        <line x1="34" y1="17" x2="50" y2="12"/>
        <line x1="50" y1="12" x2="74" y2="20"/>
        <line x1="74" y1="20" x2="100" y2="10"/>
        <line x1="100" y1="10" x2="126" y2="20"/>
        <line x1="126" y1="20" x2="150" y2="14"/>
        <line x1="150" y1="14" x2="166" y2="19"/>
        <line x1="166" y1="19" x2="182" y2="27"/>
        <line x1="18" y1="25" x2="6" y2="55"/>
        <line x1="6" y1="55" x2="12" y2="80"/>
        <line x1="12" y1="80" x2="8" y2="106"/>
        <line x1="182" y1="27" x2="194" y2="57"/>
        <line x1="194" y1="57" x2="188" y2="82"/>
        <line x1="188" y1="82" x2="192" y2="106"/>
        <line x1="18" y1="25" x2="50" y2="12"/>
        <line x1="50" y1="12" x2="100" y2="10"/>
        <line x1="100" y1="10" x2="150" y2="14"/>
        <line x1="150" y1="14" x2="182" y2="27"/>
        <line x1="6" y1="55" x2="50" y2="12"/>
        <line x1="194" y1="57" x2="150" y2="14"/>
        <line x1="34" y1="17" x2="12" y2="80"/>
        <line x1="166" y1="19" x2="188" y2="82"/>
        <line x1="18" y1="25" x2="74" y2="20"/>
        <line x1="182" y1="27" x2="126" y2="20"/>
      </g>

      <!-- Big accent stars: gold, r≥3 → dot + 8-ray cross -->
      <!-- STAR[0]: (18,25) r=3.5 -->
      <g transform="translate(18,25)" fill="#fdd835" stroke="#fdd835" stroke-linecap="round">
        <circle r="1.5" opacity="0.9"/>
        <line x1="-5.95" y1="0" x2="5.95" y2="0" stroke-width="0.9" opacity="0.8"/>
        <line x1="0" y1="-5.95" x2="0" y2="5.95" stroke-width="0.9" opacity="0.8"/>
        <line x1="-3.5" y1="-3.5" x2="3.5" y2="3.5" stroke-width="0.55" opacity="0.6"/>
        <line x1="-3.5" y1="3.5" x2="3.5" y2="-3.5" stroke-width="0.55" opacity="0.6"/>
      </g>
      <!-- STAR[1]: (100,10) r=3.0 -->
      <g transform="translate(100,10)" fill="#fdd835" stroke="#fdd835" stroke-linecap="round">
        <circle r="1.26" opacity="0.9"/>
        <line x1="-5.1" y1="0" x2="5.1" y2="0" stroke-width="0.9" opacity="0.8"/>
        <line x1="0" y1="-5.1" x2="0" y2="5.1" stroke-width="0.9" opacity="0.8"/>
        <line x1="-3" y1="-3" x2="3" y2="3" stroke-width="0.55" opacity="0.6"/>
        <line x1="-3" y1="3" x2="3" y2="-3" stroke-width="0.55" opacity="0.6"/>
      </g>
      <!-- STAR[2]: (182,27) r=3.5 -->
      <g transform="translate(182,27)" fill="#fdd835" stroke="#fdd835" stroke-linecap="round">
        <circle r="1.5" opacity="0.9"/>
        <line x1="-5.95" y1="0" x2="5.95" y2="0" stroke-width="0.9" opacity="0.8"/>
        <line x1="0" y1="-5.95" x2="0" y2="5.95" stroke-width="0.9" opacity="0.8"/>
        <line x1="-3.5" y1="-3.5" x2="3.5" y2="3.5" stroke-width="0.55" opacity="0.6"/>
        <line x1="-3.5" y1="3.5" x2="3.5" y2="-3.5" stroke-width="0.55" opacity="0.6"/>
      </g>

      <!-- Medium stars: cream, r≥1.8 → dot + 4-ray cross -->
      <g fill="#ede8df" stroke="#ede8df" stroke-linecap="round" opacity="0.65">
        <!-- STAR[3]: (50,12) r=2.2 -->
        <g transform="translate(50,12)">
          <circle r="1.1"/>
          <line x1="-3.08" y1="0" x2="3.08" y2="0" stroke-width="0.72" opacity="0.85"/>
          <line x1="0" y1="-3.08" x2="0" y2="3.08" stroke-width="0.72" opacity="0.85"/>
        </g>
        <!-- STAR[4]: (150,14) r=2.2 -->
        <g transform="translate(150,14)">
          <circle r="1.1"/>
          <line x1="-3.08" y1="0" x2="3.08" y2="0" stroke-width="0.72" opacity="0.85"/>
          <line x1="0" y1="-3.08" x2="0" y2="3.08" stroke-width="0.72" opacity="0.85"/>
        </g>
        <!-- STAR[5]: (74,20) r=1.9 -->
        <g transform="translate(74,20)">
          <circle r="0.95"/>
          <line x1="-2.66" y1="0" x2="2.66" y2="0" stroke-width="0.72" opacity="0.85"/>
          <line x1="0" y1="-2.66" x2="0" y2="2.66" stroke-width="0.72" opacity="0.85"/>
        </g>
        <!-- STAR[6]: (126,20) r=1.9 -->
        <g transform="translate(126,20)">
          <circle r="0.95"/>
          <line x1="-2.66" y1="0" x2="2.66" y2="0" stroke-width="0.72" opacity="0.85"/>
          <line x1="0" y1="-2.66" x2="0" y2="2.66" stroke-width="0.72" opacity="0.85"/>
        </g>
        <!-- STAR[7]: (6,55) r=2.0 -->
        <g transform="translate(6,55)">
          <circle r="1"/>
          <line x1="-2.8" y1="0" x2="2.8" y2="0" stroke-width="0.72" opacity="0.85"/>
          <line x1="0" y1="-2.8" x2="0" y2="2.8" stroke-width="0.72" opacity="0.85"/>
        </g>
        <!-- STAR[8]: (194,57) r=2.0 -->
        <g transform="translate(194,57)">
          <circle r="1"/>
          <line x1="-2.8" y1="0" x2="2.8" y2="0" stroke-width="0.72" opacity="0.85"/>
          <line x1="0" y1="-2.8" x2="0" y2="2.8" stroke-width="0.72" opacity="0.85"/>
        </g>
      </g>

      <!-- Small star dots: cream, r<1.8 -->
      <g fill="#ede8df" opacity="0.42">
        <circle cx="34" cy="17" r="1.6"/>
        <circle cx="166" cy="19" r="1.6"/>
        <circle cx="12" cy="80" r="1.5"/>
        <circle cx="188" cy="82" r="1.5"/>
        <circle cx="8" cy="106" r="1.3"/>
        <circle cx="192" cy="106" r="1.3"/>
      </g>

      <!-- Left horn -->
      <path d="M 52,90 C 24,84 5,66 14,38 C 18,22 28,11 30,14 C 38,22 54,58 68,86 Z"
        fill="#ede8df"/>
      <!-- Right horn -->
      <path d="M 148,90 C 176,84 195,66 186,38 C 182,22 172,11 170,14 C 162,22 146,58 132,86 Z"
        fill="#ede8df"/>
      <!-- Left ear -->
      <path d="M 42,116 C 32,98 34,78 46,74 C 56,71 66,84 62,100 Z" fill="#ede8df"/>
      <!-- Right ear -->
      <path d="M 158,116 C 168,98 166,78 154,74 C 144,71 134,84 138,100 Z" fill="#ede8df"/>
      <!-- Inner ear recesses -->
      <path d="M 44,112 C 36,96 38,80 48,78 C 56,76 63,87 60,100 Z" fill="#1a1824"/>
      <path d="M 156,112 C 164,96 162,80 152,78 C 144,76 137,87 140,100 Z" fill="#1a1824"/>

      <!-- Head oval -->
      <ellipse cx="100" cy="135" rx="56" ry="57"
        fill="#1a1824" stroke="#ede8df" stroke-width="3"/>

      <!-- Forelock (pony heritage) -->
      <path d="M 90,88 C 90,76 92,66 96,62"
        stroke="#ede8df" stroke-width="3.5" fill="none" stroke-linecap="round"/>
      <path d="M 110,88 C 110,76 108,66 104,62"
        stroke="#ede8df" stroke-width="3.5" fill="none" stroke-linecap="round"/>
      <path d="M 98,90 C 98.5,73 99.5,63 100,59 C 100.5,63 101.5,73 102,90 Z"
        fill="#ede8df"/>

      <!-- Brow ridge -->
      <path d="M 64,116 C 74,108 84,106 100,106 C 116,106 126,108 136,116"
        stroke="#ede8df" stroke-width="2.5" fill="none" stroke-linecap="round"/>

      <!-- Left eye -->
      <circle cx="80" cy="132" r="14" fill="#1a1824" stroke="#ede8df" stroke-width="2.5"/>
      <circle cx="82" cy="130" r="8.5" fill="#ede8df"/>
      <circle cx="86" cy="126" r="3.5" fill="#1a1824"/>
      <!-- Right eye -->
      <circle cx="120" cy="132" r="14" fill="#1a1824" stroke="#ede8df" stroke-width="2.5"/>
      <circle cx="118" cy="130" r="8.5" fill="#ede8df"/>
      <circle cx="114" cy="126" r="3.5" fill="#1a1824"/>

      <!-- Muzzle -->
      <path d="M 72,162 C 66,184 70,210 100,214 C 130,210 134,184 128,162"
        fill="#1a1824" stroke="#ede8df" stroke-width="2.5"/>
      <!-- Nostrils -->
      <ellipse cx="86" cy="202" rx="8.5" ry="5.5" fill="#ede8df" opacity="0.75"/>
      <ellipse cx="114" cy="202" rx="8.5" ry="5.5" fill="#ede8df" opacity="0.75"/>
      <!-- Smile -->
      <path d="M 86,210 C 92,216 108,216 114,210"
        stroke="#ede8df" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.62"/>

      <!-- Beard (gnu heritage) -->
      <path d="
        M 74,194
        C 62,202 54,220 56,236
        C 64,244 74,240 77,230
        C 78,240 81,248 85,248
        C 89,248 91,240 93,230
        C 95,240 98,246 100,248
        C 102,246 105,240 107,230
        C 109,240 111,248 115,248
        C 119,248 122,240 123,230
        C 126,240 136,244 144,236
        C 146,220 138,202 126,194
        Z"
        fill="#ede8df"/>

    </g>
  </g>

  <!-- ── Circular text — top: "FUNKY PONY SPACE" ── -->
  <text
    font-family="'Trebuchet MS', 'Arial Black', Arial, sans-serif"
    font-weight="900"
    font-size="27"
    fill="#fdd835"
    letter-spacing="12">
    <textPath href="#ta" startOffset="50%" text-anchor="middle">FUNKY PONY SPACE</textPath>
  </text>

  <!-- ── Circular text — bottom: "· COMMUNITY PANTRY ·" ── -->
  <text
    font-family="'Trebuchet MS', Arial, sans-serif"
    font-weight="700"
    font-size="17"
    fill="#fdd835"
    letter-spacing="7"
    opacity="0.65">
    <textPath href="#ba" startOffset="50%" text-anchor="middle">· COMMUNITY PANTRY ·</textPath>
  </text>

</svg>
