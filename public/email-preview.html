<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Funky Pony — Email Preview</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0d0d0d;
      color: #e0e0e0;
      font-family: 'Courier New', Courier, monospace;
      min-height: 100vh;
    }
    /* ── Toolbar ── */
    .toolbar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: #111;
      border-bottom: 2px solid #FDD835;
      padding: 10px 20px;
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }
    .toolbar-brand {
      font-size: 10px;
      letter-spacing: 5px;
      color: #FDD835;
      font-weight: 900;
      white-space: nowrap;
    }
    .toolbar-divider { width: 1px; height: 24px; background: #333; }
    .type-tabs {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .type-tab {
      background: #1a1a1a;
      border: 1px solid #333;
      color: #999;
      padding: 5px 12px;
      font-family: 'Courier New', monospace;
      font-size: 10px;
      letter-spacing: 2px;
      cursor: pointer;
      transition: all 0.15s;
      text-transform: uppercase;
    }
    .type-tab:hover { border-color: #FDD835; color: #FDD835; }
    .type-tab.active { background: #FDD835; color: #000; border-color: #FDD835; font-weight: 900; }
    .view-toggle {
      margin-left: auto;
      display: flex;
      gap: 6px;
    }
    .view-btn {
      background: #1a1a1a;
      border: 1px solid #333;
      color: #999;
      padding: 5px 12px;
      font-family: 'Courier New', monospace;
      font-size: 10px;
      letter-spacing: 2px;
      cursor: pointer;
      text-transform: uppercase;
    }
    .view-btn.active { background: #4A5D66; color: #fff; border-color: #4A5D66; }

    /* ── Main layout ── */
    .main {
      padding: 24px 20px;
    }
    .preview-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }
    .preview-row.single {
      grid-template-columns: minmax(0, 600px);
      justify-content: center;
    }
    .preview-card {
      background: #161616;
      border: 1px solid #2a2a2a;
      border-radius: 3px;
      overflow: hidden;
    }
    .preview-card-header {
      background: #1e1e1e;
      padding: 8px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #2a2a2a;
    }
    .preview-card-label {
      font-size: 9px;
      letter-spacing: 3px;
      color: #FDD835;
      font-weight: 900;
      text-transform: uppercase;
    }
    .preview-card-sublabel {
      font-size: 9px;
      letter-spacing: 2px;
      color: #555;
    }
    iframe.email-frame {
      display: block;
      width: 100%;
      border: none;
      background: #0a0a0a;
    }

    /* ── Subject line chip ── */
    .subject-chip {
      background: #0a0a0a;
      border-bottom: 1px solid #1e1e1e;
      padding: 6px 14px;
      font-size: 10px;
      color: #888;
      letter-spacing: 1px;
    }
    .subject-chip strong { color: #ccc; }

    /* ── All emails grid view ── */
    .all-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(500px, 1fr));
      gap: 16px;
      max-width: 1400px;
      margin: 0 auto;
    }

    /* ── Status bar ── */
    .status-bar {
      padding: 8px 20px;
      background: #0a0a0a;
      border-top: 1px solid #1e1e1e;
      font-size: 9px;
      color: #444;
      letter-spacing: 2px;
    }
  </style>
</head>
<body>

<div class="toolbar">
  <div class="toolbar-brand">FUNKY PONY — EMAIL PREVIEW</div>
  <div class="toolbar-divider"></div>
  <div class="type-tabs" id="typeTabs">
    <button class="type-tab active" data-type="driver-invite">Driver Invite</button>
    <button class="type-tab" data-type="welcome">Welcome</button>
    <button class="type-tab" data-type="test">Setup Test</button>

  <div class="view-toggle">

// ─────────────────────────────────────────────────────────────────────────────
// Render logic
// ─────────────────────────────────────────────────────────────────────────────

let currentType = 'driver-invite';
let currentVariant = 'current';

function setVariant(v) {
  currentVariant = v;
  document.getElementById('btnCurrent').classList.toggle('active', v === 'current');
  document.getElementById('btnProposed').classList.toggle('active', v === 'proposed');
  document.getElementById('btnSide').classList.toggle('active', v === 'side');
  render();
}

function makeFrame(html, height = 680) {
  const iframe = document.createElement('iframe');
  iframe.className = 'email-frame';
  iframe.style.height = height + 'px';
  iframe.srcdoc = html;
  return iframe;
}

function makeCard(label, sublabel, html) {
  const card = document.createElement('div');
  card.className = 'preview-card';
  const hdr = document.createElement('div');
  hdr.className = 'preview-card-header';
  hdr.innerHTML = `<span class="preview-card-label">${label}</span><span class="preview-card-sublabel">${sublabel}</span>`;
  card.appendChild(hdr);
  card.appendChild(makeFrame(html));
  return card;
}

function render() {
  const main = document.getElementById('main');
  main.innerHTML = '';

  if (currentType === 'all') {
    const grid = document.createElement('div');
    grid.className = 'all-grid';
    for (const [key, tpl] of Object.entries(TEMPLATES)) {
      const html = currentVariant === 'proposed' ? tpl.proposed() : tpl.current();
      const card = makeCard(tpl.label, tpl.subject, html);
      card.querySelector('iframe').style.height = '520px';
      grid.appendChild(card);
    }
    main.appendChild(grid);
    document.getElementById('statusBar').textContent =
      `ALL EMAIL TYPES — ${currentVariant.toUpperCase()} DESIGN — ${Object.keys(TEMPLATES).length} TEMPLATES`;
    return;
  }

  const tpl = TEMPLATES[currentType];
  if (!tpl) return;

  if (currentVariant === 'side') {
    const row = document.createElement('div');
    row.className = 'preview-row';
    row.appendChild(makeCard('CURRENT', tpl.subject, tpl.current()));
    row.appendChild(makeCard('PROPOSED ✦', tpl.subject, tpl.proposed()));
    main.appendChild(row);
  } else {
    const row = document.createElement('div');
    row.className = 'preview-row single';
    const html = currentVariant === 'proposed' ? tpl.proposed() : tpl.current();
    row.appendChild(makeCard(currentVariant === 'proposed' ? 'PROPOSED ✦' : 'CURRENT', tpl.subject, html));
    main.appendChild(row);
  }

  document.getElementById('statusBar').textContent =
    `${tpl.label.toUpperCase()} — SUBJECT: "${tpl.subject}" — ${currentVariant.toUpperCase()} DESIGN`;
}

// ── Tab clicks ──
document.getElementById('typeTabs').addEventListener('click', (e) => {
  const btn = e.target.closest('.type-tab');
  if (!btn) return;
  document.querySelectorAll('.type-tab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  currentType = btn.dataset.type;
  render();
});

render();
</script>
</body>
</html>
