<svg viewBox="0 0 80 800" xmlns="http://www.w3.org/2000/svg">
  <!-- Base parchment -->
  <rect width="80" height="800" fill="#FFF9F0"/>

  <!-- Color bands -->
  <!-- Terracotta top band -->
  <rect x="0"  y="0"   width="80" height="55"  fill="#E2725B" opacity="0.62"/>
  <!-- Parchment: 55–140 -->
  <!-- Morning mist band -->
  <rect x="0"  y="140" width="80" height="70"  fill="#4A5D66" opacity="0.58"/>
  <!-- Parchment: 210–280 -->
  <!-- Goldenrod: full width band -->
  <rect x="0"  y="280" width="80" height="90"  fill="#F9A602" opacity="0.55"/>
  <!-- Subdivided right cell within golden band -->
  <rect x="50" y="280" width="30" height="90"  fill="#F9A602" opacity="0.35"/>
  <!-- Parchment: 370–440 -->
  <!-- Small terracotta -->
  <rect x="0"  y="440" width="35" height="50"  fill="#E2725B" opacity="0.50"/>
  <!-- Parchment: 490–560 -->
  <!-- Morning mist tall -->
  <rect x="0"  y="560" width="80" height="110" fill="#4A5D66" opacity="0.42"/>
  <!-- Accent slim inside mist -->
  <rect x="15" y="600" width="50" height="40"  fill="#F9A602" opacity="0.40"/>
  <!-- Parchment: 670–720 -->
  <!-- Terracotta bottom -->
  <rect x="0"  y="720" width="80" height="55"  fill="#E2725B" opacity="0.55"/>
  <!-- White cell accent -->
  <rect x="20" y="730" width="60" height="30"  fill="#FFFFFF" opacity="0.60"/>

  <!-- Horizontal grid lines -->
  <line x1="0" y1="55"  x2="80" y2="55"  stroke="#2C2420" stroke-width="3"/>
  <line x1="0" y1="140" x2="80" y2="140" stroke="#2C2420" stroke-width="2.5"/>
  <line x1="0" y1="210" x2="80" y2="210" stroke="#2C2420" stroke-width="2.5"/>
  <line x1="0" y1="280" x2="80" y2="280" stroke="#2C2420" stroke-width="3"/>
  <line x1="0" y1="370" x2="80" y2="370" stroke="#2C2420" stroke-width="3"/>
  <line x1="0" y1="440" x2="80" y2="440" stroke="#2C2420" stroke-width="2"/>
  <line x1="0" y1="490" x2="80" y2="490" stroke="#2C2420" stroke-width="2"/>
  <line x1="0" y1="560" x2="80" y2="560" stroke="#2C2420" stroke-width="3"/>
  <line x1="15" y1="600" x2="80" y2="600" stroke="#2C2420" stroke-width="2"/>
  <line x1="15" y1="640" x2="80" y2="640" stroke="#2C2420" stroke-width="2"/>
  <line x1="0" y1="670" x2="80" y2="670" stroke="#2C2420" stroke-width="2.5"/>
  <line x1="0" y1="720" x2="80" y2="720" stroke="#2C2420" stroke-width="3"/>
  <line x1="20" y1="730" x2="80" y2="730" stroke="#2C2420" stroke-width="2"/>

  <!-- Vertical subdividers -->
  <line x1="50" y1="280" x2="50" y2="370" stroke="#2C2420" stroke-width="2"/>
  <line x1="35" y1="440" x2="35" y2="490" stroke="#2C2420" stroke-width="2"/>
  <line x1="15" y1="560" x2="15" y2="670" stroke="#2C2420" stroke-width="2"/>
  <line x1="20" y1="720" x2="20" y2="800" stroke="#2C2420" stroke-width="2"/>

  <!-- Left edge (Mondrian border signature) -->
  <line x1="0" y1="0" x2="0" y2="800" stroke="#2C2420" stroke-width="5"/>
  <!-- Right edge -->
  <line x1="79" y1="0" x2="79" y2="800" stroke="#2C2420" stroke-width="2"/>
</svg>
