<!--
  Funky Pony — GNU × Pony hybrid mascot
  GPL-3.0 tribute for Funky Pony Pantry (https://github.com/biomassives/foodbank)

  A wildebeest-pony hybrid floating in a star-node lattice.
  The constellation fabric represents decentralised infrastructure —
  mutual needs anticipated and met, so communities can function at a
  higher level and build safer, locally-empowered food systems.

  Based on the Heckert GNU mascot tradition (GNU Project / FSF).
  Original GNU art: Etienne Suvasa / Karl Berry (CC-BY-SA 2.0).
  This derivative: Funky Pony Pantry contributors, GPL-3.0.
-->
<svg
  width="200" height="250"
  viewBox="0 0 200 250"
  xmlns="http://www.w3.org/2000/svg"
  aria-label="Funky Pony — free software, decentralized community infrastructure"
  role="img"
>
  <title>Funky Pony Mascot — GPL-3.0</title>
  <desc>
    A gnu-pony hybrid head surrounded by a star constellation lattice,
    representing decentralised food system infrastructure built on free software.
  </desc>

  <!-- ── Star lattice connection lines ── -->
  <g stroke="#1a1a1a" stroke-width="0.75" fill="none" opacity="0.17">
    <line x1="18"  y1="25"  x2="34"  y2="17"  />
    <line x1="34"  y1="17"  x2="50"  y2="12"  />
    <line x1="50"  y1="12"  x2="74"  y2="20"  />
    <line x1="74"  y1="20"  x2="100" y2="10"  />
    <line x1="100" y1="10"  x2="126" y2="20"  />
    <line x1="126" y1="20"  x2="150" y2="14"  />
    <line x1="150" y1="14"  x2="166" y2="19"  />
    <line x1="166" y1="19"  x2="182" y2="27"  />
    <line x1="18"  y1="25"  x2="6"   y2="55"  />
    <line x1="6"   y1="55"  x2="12"  y2="80"  />
    <line x1="12"  y1="80"  x2="8"   y2="106" />
    <line x1="182" y1="27"  x2="194" y2="57"  />
    <line x1="194" y1="57"  x2="188" y2="82"  />
    <line x1="188" y1="82"  x2="192" y2="106" />
    <line x1="18"  y1="25"  x2="50"  y2="12"  />
    <line x1="50"  y1="12"  x2="100" y2="10"  />
    <line x1="100" y1="10"  x2="150" y2="14"  />
    <line x1="150" y1="14"  x2="182" y2="27"  />
    <line x1="6"   y1="55"  x2="50"  y2="12"  />
    <line x1="194" y1="57"  x2="150" y2="14"  />
    <line x1="34"  y1="17"  x2="12"  y2="80"  />
    <line x1="166" y1="19"  x2="188" y2="82"  />
    <line x1="18"  y1="25"  x2="74"  y2="20"  />
    <line x1="182" y1="27"  x2="126" y2="20"  />
  </g>

  <!-- ── Stars: big accent (gold) ── -->
  <g fill="#c77700" opacity="0.75">
    <!-- 0: upper-left big -->
    <circle cx="18" cy="25" r="1.5"/>
    <line x1="12" y1="25" x2="24" y2="25" stroke="#c77700" stroke-width="0.9" fill="none"/>
    <line x1="18" y1="19" x2="18" y2="31" stroke="#c77700" stroke-width="0.9" fill="none"/>
    <line x1="13" y1="20" x2="23" y2="30" stroke="#c77700" stroke-width="0.55" fill="none"/>
    <line x1="13" y1="30" x2="23" y2="20" stroke="#c77700" stroke-width="0.55" fill="none"/>
    <!-- 1: top-centre big -->
    <circle cx="100" cy="10" r="1.3"/>
    <line x1="94" y1="10" x2="106" y2="10" stroke="#c77700" stroke-width="0.9" fill="none"/>
    <line x1="100" y1="4" x2="100" y2="16" stroke="#c77700" stroke-width="0.9" fill="none"/>
    <line x1="95.5" y1="5.5" x2="104.5" y2="14.5" stroke="#c77700" stroke-width="0.55" fill="none"/>
    <line x1="95.5" y1="14.5" x2="104.5" y2="5.5" stroke="#c77700" stroke-width="0.55" fill="none"/>
    <!-- 2: upper-right big -->
    <circle cx="182" cy="27" r="1.5"/>
    <line x1="176" y1="27" x2="188" y2="27" stroke="#c77700" stroke-width="0.9" fill="none"/>
    <line x1="182" y1="21" x2="182" y2="33" stroke="#c77700" stroke-width="0.9" fill="none"/>
    <line x1="177" y1="22" x2="187" y2="32" stroke="#c77700" stroke-width="0.55" fill="none"/>
    <line x1="177" y1="32" x2="187" y2="22" stroke="#c77700" stroke-width="0.55" fill="none"/>
  </g>

  <!-- ── Stars: medium ── -->
  <g fill="#1a1a1a" opacity="0.55">
    <circle cx="50" cy="12" r="1.1"/>
    <line x1="47" y1="12" x2="53" y2="12" stroke="#1a1a1a" stroke-width="0.72" fill="none"/>
    <line x1="50" y1="9"  x2="50" y2="15" stroke="#1a1a1a" stroke-width="0.72" fill="none"/>
    <circle cx="150" cy="14" r="1.1"/>
    <line x1="147" y1="14" x2="153" y2="14" stroke="#1a1a1a" stroke-width="0.72" fill="none"/>
    <line x1="150" y1="11" x2="150" y2="17" stroke="#1a1a1a" stroke-width="0.72" fill="none"/>
    <circle cx="74" cy="20" r="0.95"/>
    <line x1="71.5" y1="20" x2="76.5" y2="20" stroke="#1a1a1a" stroke-width="0.72" fill="none"/>
    <line x1="74" y1="17.5" x2="74" y2="22.5" stroke="#1a1a1a" stroke-width="0.72" fill="none"/>
    <circle cx="126" cy="20" r="0.95"/>
    <line x1="123.5" y1="20" x2="128.5" y2="20" stroke="#1a1a1a" stroke-width="0.72" fill="none"/>
    <line x1="126" y1="17.5" x2="126" y2="22.5" stroke="#1a1a1a" stroke-width="0.72" fill="none"/>
    <circle cx="6"   cy="55"  r="1.0"/>
    <line x1="3" y1="55" x2="9" y2="55" stroke="#1a1a1a" stroke-width="0.72" fill="none"/>
    <line x1="6" y1="52" x2="6" y2="58" stroke="#1a1a1a" stroke-width="0.72" fill="none"/>
    <circle cx="194" cy="57" r="1.0"/>
    <line x1="191" y1="57" x2="197" y2="57" stroke="#1a1a1a" stroke-width="0.72" fill="none"/>
    <line x1="194" y1="54" x2="194" y2="60" stroke="#1a1a1a" stroke-width="0.72" fill="none"/>
  </g>

  <!-- ── Stars: small dots ── -->
  <g fill="#1a1a1a" opacity="0.40">
    <circle cx="34"  cy="17"  r="1.6"/>
    <circle cx="166" cy="19"  r="1.6"/>
    <circle cx="12"  cy="80"  r="1.5"/>
    <circle cx="188" cy="82"  r="1.5"/>
    <circle cx="8"   cy="106" r="1.3"/>
    <circle cx="192" cy="106" r="1.3"/>
  </g>

  <!-- ── Left Horn ── -->
  <path d="M 52,90 C 24,84 5,66 14,38 C 18,22 28,11 30,14 C 38,22 54,58 68,86 Z"
    fill="#1a1a1a"/>

  <!-- ── Right Horn ── -->
  <path d="M 148,90 C 176,84 195,66 186,38 C 182,22 172,11 170,14 C 162,22 146,58 132,86 Z"
    fill="#1a1a1a"/>

  <!-- ── Left Ear (outer) ── -->
  <path d="M 42,116 C 32,98 34,78 46,74 C 56,71 66,84 62,100 Z" fill="#1a1a1a"/>
  <!-- ── Right Ear (outer) ── -->
  <path d="M 158,116 C 168,98 166,78 154,74 C 144,71 134,84 138,100 Z" fill="#1a1a1a"/>
  <!-- Inner ear recesses -->
  <path d="M 44,112 C 36,96 38,80 48,78 C 56,76 63,87 60,100 Z" fill="#ffffff"/>
  <path d="M 156,112 C 164,96 162,80 152,78 C 144,76 137,87 140,100 Z" fill="#ffffff"/>

  <!-- ── Head Oval ── -->
  <ellipse cx="100" cy="135" rx="56" ry="57"
    fill="#ffffff" stroke="#1a1a1a" stroke-width="3"/>

  <!-- ── Forelock (pony mane) ── -->
  <path d="M 90,88 C 90,76 92,66 96,62"
    stroke="#1a1a1a" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <path d="M 110,88 C 110,76 108,66 104,62"
    stroke="#1a1a1a" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <path d="M 98,90 C 98.5,73 99.5,63 100,59 C 100.5,63 101.5,73 102,90 Z"
    fill="#1a1a1a"/>

  <!-- ── Brow Ridge ── -->
  <path d="M 64,116 C 74,108 84,106 100,106 C 116,106 126,108 136,116"
    stroke="#1a1a1a" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- ── Left Eye ── -->
  <circle cx="80" cy="132" r="14" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.5"/>
  <circle cx="82" cy="130" r="8.5" fill="#1a1a1a"/>
  <circle cx="86" cy="126" r="3.5" fill="#ffffff"/>
  <!-- ── Right Eye ── -->
  <circle cx="120" cy="132" r="14" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.5"/>
  <circle cx="118" cy="130" r="8.5" fill="#1a1a1a"/>
  <circle cx="114" cy="126" r="3.5" fill="#ffffff"/>

  <!-- ── Muzzle ── -->
  <path d="M 72,162 C 66,184 70,210 100,214 C 130,210 134,184 128,162"
    fill="#ffffff" stroke="#1a1a1a" stroke-width="2.5"/>
  <!-- Nostrils -->
  <ellipse cx="86"  cy="202" rx="8.5" ry="5.5" fill="#1a1a1a" opacity="0.75"/>
  <ellipse cx="114" cy="202" rx="8.5" ry="5.5" fill="#1a1a1a" opacity="0.75"/>
  <!-- Smile -->
  <path d="M 86,210 C 92,216 108,216 114,210"
    stroke="#1a1a1a" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.62"/>

  <!-- ── Beard ── -->
  <path d="
    M 74,194
    C 62,202 54,220 56,236
    C 64,244 74,240 77,230
    C 78,240 81,248 85,248
    C 89,248 91,240 93,230
    C 95,240 98,246 100,248
    C 102,246 105,240 107,230
    C 109,240 111,248 115,248
    C 119,248 122,240 123,230
    C 126,240 136,244 144,236
    C 146,220 138,202 126,194
    Z"
    fill="#1a1a1a"/>

</svg>
